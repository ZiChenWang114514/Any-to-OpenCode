<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Any-to-OpenCode</title>
  <desc id="desc">Route work from any compatible harness to local OpenCode sessions. Discover models, verify them, and resume exact sessions.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#surface)"/>
  <path d="M0 76H1200M708 76V420" stroke="#1e2d43" stroke-width="1"/>

  <g id="metadata" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <circle cx="58" cy="39" r="6" fill="#5eead4"/>
    <text x="76" y="46" fill="#94a3b8">HARNESS INTERCONNECT · OPENCODE</text>
    <text x="1138" y="46" text-anchor="end" fill="#7dd3fc">DISCOVER · VERIFY · RUN</text>
  </g>

  <g id="title-block" transform="translate(58 118)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="750">Any-to</text>
    <text x="0" y="66" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="750">OpenCode</text>
    <text x="0" y="120" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Route any compatible harness</text>
    <text x="0" y="155" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">to verified local OpenCode sessions.</text>

    <g transform="translate(0 202)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <rect width="168" height="42" rx="10" fill="#102239" stroke="#28415d"/>
      <text x="18" y="27" fill="#7dd3fc">live metadata</text>
      <rect x="182" width="166" height="42" rx="10" fill="#102239" stroke="#28415d"/>
      <text x="200" y="27" fill="#5eead4">parallel smoke</text>
      <rect x="362" width="166" height="42" rx="10" fill="#102239" stroke="#28415d"/>
      <text x="380" y="27" fill="#cbd5e1">exact cleanup</text>
    </g>
  </g>

  <g id="dispatch-proof" transform="translate(748 104)">
    <rect width="394" height="282" rx="18" fill="#081421" stroke="#28415d" stroke-width="2"/>
    <g transform="translate(22 23)">
      <circle cx="7" cy="7" r="7" fill="#fb7185"/>
      <circle cx="31" cy="7" r="7" fill="#fbbf24"/>
      <circle cx="55" cy="7" r="7" fill="#5eead4"/>
      <text x="348" y="13" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">free-pool --parallel 3</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <g transform="translate(24 78)">
        <rect width="110" height="100" rx="14" fill="#102239" stroke="#28415d"/>
        <text x="55" y="33" text-anchor="middle" fill="#7dd3fc" font-size="19">DISCOVER</text>
        <text x="55" y="63" text-anchor="middle" fill="#f8fafc" font-size="18">zero cost</text>
        <text x="55" y="87" text-anchor="middle" fill="#94a3b8" font-size="18">active</text>
      </g>
      <g transform="translate(142 78)">
        <rect width="110" height="100" rx="14" fill="#102239" stroke="#28415d"/>
        <text x="55" y="33" text-anchor="middle" fill="#5eead4" font-size="19">VERIFY</text>
        <text x="55" y="63" text-anchor="middle" fill="#f8fafc" font-size="18">reply</text>
        <text x="55" y="87" text-anchor="middle" fill="#94a3b8" font-size="18">model</text>
      </g>
      <g transform="translate(260 78)">
        <rect width="110" height="100" rx="14" fill="#102239" stroke="#28415d"/>
        <text x="55" y="33" text-anchor="middle" fill="#7dd3fc" font-size="19">DISPATCH</text>
        <text x="55" y="63" text-anchor="middle" fill="#f8fafc" font-size="18">passed</text>
        <text x="55" y="87" text-anchor="middle" fill="#94a3b8" font-size="18">routes</text>
      </g>
    </g>

    <g transform="translate(24 214)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <circle cx="8" cy="8" r="8" fill="#5eead4"/>
      <text x="28" y="14" fill="#cbd5e1">verified replies · clear failures</text>
    </g>
  </g>
</svg>
